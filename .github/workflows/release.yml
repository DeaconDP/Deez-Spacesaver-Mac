name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify (build + test)
        run: ./scripts/verify.sh

      - name: Build release app and DMG
        run: |
          chmod +x scripts/build-app.sh scripts/create-dmg.sh scripts/build-release.sh
          ./scripts/build-release.sh Release

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Deez-Spacesaver-Mac.dmg
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Deez-Spacesaver-Mac-dmg
          path: dist/Deez-Spacesaver-Mac.dmg
